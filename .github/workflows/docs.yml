name: Auto Build & Deploy Docs

on:
  push:
    branches:
      - main
      - lib
    paths:
      - 'src/apis/**'
      - 'docs/**'
      - 'scripts/generateDocs.js'
      - 'scripts/deployDocs.js'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

jobs:
  deploy-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate & Deploy VitePress Docs to softtyos/zca-js-docs
        run: npm run docs:deploy
        env:
          DOCS_DEPLOY_TOKEN: ${{ secrets.DOCS_DEPLOY_TOKEN }}
